openapi: 3.1.0
info:
  title: Password recovery API
  version: 0.1.0-provisional
  description: >-
    Provisional AUTH-10-BE contract. Activation still depends on the PO decision,
    AUTH-10-DB migration, BE-005 password hasher, session revocation and an
    approved token delivery adapter.
paths:
  /api/v1/auth/password-recovery:
    post:
      operationId: requestPasswordRecovery
      summary: Requests a password recovery message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryRequest'
      responses:
        '202':
          description: Request accepted without revealing account existence
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /api/v1/auth/password-reset:
    post:
      operationId: resetPassword
      summary: Replaces a password using a one-time token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Password replaced and sessions revoked
        '400':
          $ref: '#/components/responses/InvalidRequest'
components:
  schemas:
    PasswordRecoveryRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    PasswordResetRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          writeOnly: true
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
  responses:
    InvalidRequest:
      description: Invalid or expired request
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: {type: string, format: uri}
              title: {type: string}
              status: {type: integer}
              code: {type: string}
              correlation_id: {type: string}
