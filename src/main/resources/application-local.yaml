# Perfil exclusivo de desenvolvimento local: habilita Swagger e endpoints sem autenticação.
spring:
  jpa:
    hibernate:
      # Enquanto o time de banco não publica as migrations, o Hibernate cria as tabelas localmente.
      # Quando as migrations oficiais existirem, remova esta linha (volta a valer o "validate").
      ddl-auto: update
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
platform:
  crud:
    api:
      enabled: true
  audit:
    api:
      enabled: true
  certificate:
    # Enquanto a página do frontend não existe, o QR aponta direto para a API local.
    validation-url-template: http://localhost:8080/api/v1/public/certificates/{id}?hash={hash}
    validation:
      enabled: true
