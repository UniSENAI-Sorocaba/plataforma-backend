# Perfil exclusivo de desenvolvimento local: habilita Swagger e endpoints sem autenticação.
spring:
  jpa:
    hibernate:
      # Mantém as tabelas legadas de CRUD locais; não cria o schema oficial auth.user/RBAC.
      ddl-auto: update
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true
security:
  jwt:
    enabled: ${JWT_ENABLED:false}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
platform:
  crud:
    api:
      enabled: true
  audit:
    api:
      enabled: true
