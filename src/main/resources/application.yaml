spring:
  application:
    name: plataforma-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
security:
  password-recovery:
    delivery: ${SECURITY_PASSWORD_RECOVERY_DELIVERY:disabled}
    from: ${SECURITY_PASSWORD_RECOVERY_FROM:no-reply@plataforma.local}
    reset-base-url: ${SECURITY_PASSWORD_RECOVERY_RESET_BASE_URL:http://localhost:3000/login}
