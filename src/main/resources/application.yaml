spring:
  application:
    name: plataforma-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plataforma}
    username: ${DB_USERNAME:plataforma}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # O schema pertence ao repositório plataforma-database; o backend apenas valida.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 100
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
platform:
  security:
    password:
      argon2:
        # Defaults mínimos OWASP; calibrar no ambiente alvo antes de produção.
        memory-kib: ${ARGON2_MEMORY_KIB:19456}
        iterations: ${ARGON2_ITERATIONS:2}
        parallelism: ${ARGON2_PARALLELISM:1}
        salt-length: ${ARGON2_SALT_LENGTH:16}
        hash-length: ${ARGON2_HASH_LENGTH:32}
  crud:
    api:
      # Os endpoints de CRUD ainda não exigem login (BE-004/BE-010): ficam desligados fora dos
      # perfis local e test até a autenticação existir.
      enabled: false
  audit:
    api:
      # Leitura de auditoria fica desligada até existir RBAC server-side (BE-010).
      enabled: false
