# Ambiente local: PostgreSQL + API. Uso: docker compose up --build
# Credenciais abaixo são exclusivas de desenvolvimento local.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plataforma
      POSTGRES_USER: plataforma
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plataforma -d plataforma"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - database-data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/plataforma
      DB_USERNAME: plataforma
      DB_PASSWORD: local-development-only
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  database-data:
