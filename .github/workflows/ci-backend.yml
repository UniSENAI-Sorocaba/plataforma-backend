name: Backend Security CI Pipeline

# [QA-005] SAST + SCA + revisão de dependências. Política: POL-INFRA-001 (ci-cd.md).
# CodeQL roda quando o plano permitir (vars.CODEQL_ENABLED=true); Semgrep CE é o equivalente aceito pela política e roda sempre.

on:
  push:
    branches: [ main, develop, feature/* ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main, develop, feature/* ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci-backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-codeql:
    if: ${{ vars.CODEQL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      - name: Build for analysis
        run: |
          mvn --batch-mode -DskipTests package

      - name: Analyze
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          category: /language:java-kotlin

  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Semgrep CE
        run: pip install "semgrep>=1.90,<2"

      - name: Run Semgrep CE
        run: |
          semgrep scan --config p/default --config p/java --config p/owasp-top-ten \
            --metrics=off --json-output=semgrep.json --text . || true

      - name: Summarize findings (severity, file, reason, fix path)
        if: always()
        run: |
          {
            echo "### Semgrep CE (SAST) – raiz"
            echo ""
            echo "| Gravidade | Arquivo:linha | Motivo | Caminho de correção |"
            echo "|---|---|---|---|"
            jq -r '.results[] | "| \(.extra.severity) | \(.path):\(.start.line) | \(.extra.message | gsub("[\n|]";" ")) | \(.extra.fix // .extra.metadata.references[0] // .check_id) |"' semgrep.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Block merge on ERROR findings
        run: |
          n=$(jq '[.results[] | select(.extra.severity=="ERROR")] | length' semgrep.json)
          echo "Findings ERROR: $n"
          [ "$n" -eq 0 ]

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-report
          path: semgrep.json

  sca-osv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Falha com vulnerabilidade conhecida nas dependências Maven; a tabela mostra pacote, versão, gravidade e versão corrigida.
      - name: OSV-Scanner (pom.xml)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pom.xml:pom.xml

  dependency-review:
    if: ${{ github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure