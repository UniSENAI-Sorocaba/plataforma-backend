name: Backend contracts

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts and producer tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install locked development tools
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Audit contract tooling
        run: npm audit --audit-level=high
      - name: Install checksum-pinned oasdiff
        run: npm run contracts:install-diff
      - name: Validate contract and exercise mock and negative gates
        shell: bash
        run: |
          mkdir -p target/contracts
          set -o pipefail
          npm run contracts:verify 2>&1 | tee target/contracts/verification.log
      - name: Compare with immutable base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run contracts:breaking -- "$BASE_SHA"
      - name: Verify Spring Boot producer
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Preserve contract and producer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-evidence
          path: |
            target/contracts/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  spec-compliance:
    name: Spec compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: contracts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
      - name: Download technical evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: contract-evidence
          path: target
      - name: Resolve official baseline and BE-003 dependencies
        env:
          GOVERNANCE_READ_TOKEN: ${{ secrets.GOVERNANCE_READ_TOKEN }}
        run: npm run spec-compliance
      - name: Preserve compliance report even on FAIL
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spec-compliance-report
          path: target/contracts/spec-compliance.json
          if-no-files-found: warn
          retention-days: 14
