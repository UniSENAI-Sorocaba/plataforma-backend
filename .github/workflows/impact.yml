name: Impact publication API

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  impact-evidence:
    name: Impact evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Record incomplete task status
        if: always()
        shell: bash
        run: cat docs/compliance/BE-019.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve test, fixtures, coverage and compliance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: impact-evidence
          path: |
            target/surefire-reports/
            target/site/jacoco-backend/
            target/site/jacoco-critical/
            src/test/resources/impact/
            contracts/impact.openapi.json
            docs/compliance/BE-019.md
          if-no-files-found: warn
          retention-days: 14
