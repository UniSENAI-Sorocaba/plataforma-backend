    CorrelationId:
      type: string
      pattern: ^[A-Za-z0-9._-]{1,64}$
    ProblemDetail:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - code
      - message
      - correlation_id
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        message:
          type: string
        correlation_id:
          $ref: '#/components/schemas/CorrelationId'
        fields:
          type: object
          additionalProperties:
            type: string
    Pagination:
      type: object
      required:
      - content
      - page
      - size
      - totalElements
      - totalPages
      properties:
        content:
          type: array
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    LoginRequest:
      description: Proposta para integração com CONTRACT-AUTH-001, sujeita à aprovação.
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
    LoginResponse:
      description: Proposta para CONTRACT-AUTH-001. O refresh token é transportado em cookie seguro conforme ADR-003.
      type: object
      required:
      - access_token
      - token_type
      properties:
        access_token:
          type: string
          description: Access token JWT assinado com RS256.
        token_type:
          type: string
          const: Bearer
  headers:
    CorrelationId:
      description: Identificador de correlação da requisição.
      schema:
        $ref: '#/components/schemas/CorrelationId'
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      description: Identificador opcional. A aplicação gera outro quando ausente ou inválido.
      schema:
        $ref: '#/components/schemas/CorrelationId'
  responses:
    Problem400:
      description: Requisição inválida.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Problem404:
      description: Recurso não encontrado.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            notFound:
              value:
                type: https://errors.plataforma.senai.br/not_found
                title: Recurso não encontrado
                status: 404
                detail: Resource not found
                code: NOT_FOUND
                message: Resource not found
                correlation_id: consumer-42
    Problem409:
      description: Conflito com o estado atual.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Problem415:
      description: Content-Type incompatível.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Healthy:
      description: Aplicação saudável.
      content:
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: '#/components/schemas/Health'
          examples:
            up:
              value:
                status: UP
    Unhealthy:
      description: Aplicação indisponível; formato operacional nativo do Actuator.
      content:
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: '#/components/schemas/Health'
          examples:
            down:
              value:
                status: DOWN
            outOfService:
              value:
                status: OUT_OF_SERVICE
x-proposed-auth-schemas:
  request:
    $ref: '#/components/schemas/LoginRequest'
  response:
    $ref: '#/components/schemas/LoginResponse'
