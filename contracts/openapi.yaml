openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Plataforma Digital — Backend
  version: 0.1.0
  description: >-
    Contrato local das rotas operacionais e dos controllers existentes na develop.
    As rotas de CRUD e auditoria dependem das opções de ambiente.
    Os contratos oficiais são CONTRACT-AUTH-001,
    CONTRACT-PI-001, CONTRACT-EXT-001 ou CONTRACT-PORTAL-001.
servers:
  - url: https://api.example.test
    description: Endereço sintético; configurar a URL do ambiente no cliente.
security: []
tags:
  - name: Operations
    description: Saúde e informações técnicas sem detalhes sensíveis.
  - name: Auditoria (somente local)
    description: Criação manual de eventos para testes
  - name: Auditoria
    description: Consulta de eventos de auditoria (public.audit_event)
paths:
  /actuator/health:
    get:
      operationId: getHealth
      summary: Consultar a saúde da aplicação
      description: Retorna status agregado e nomes dos grupos, sem detalhes dos componentes.
      tags: [Operations]
      security: []
      responses:
        '200':
          description: Aplicação saudável e grupos de probes disponíveis.
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                up:
                  value:
                    status: UP
                    groups: [liveness, readiness]
        '503':
          description: Aplicação indisponível; formato operacional nativo do Actuator.
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                down:
                  value:
                    status: DOWN
                    groups: [liveness, readiness]
                outOfService:
                  value:
                    status: OUT_OF_SERVICE
                    groups: [liveness, readiness]
  /actuator/health/liveness:
    get:
      operationId: getLiveness
      summary: Consultar se o processo está vivo
      description: Probe do Spring Boot Actuator, sem detalhes internos.
      tags: [Operations]
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/Unhealthy'
  /actuator/health/readiness:
    get:
      operationId: getReadiness
      summary: Consultar se a aplicação aceita tráfego
      description: Probe do Spring Boot Actuator, sem detalhes internos.
      tags: [Operations]
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/Unhealthy'
  /actuator/info:
    get:
      operationId: getInfo
      summary: Consultar informações públicas da aplicação
      description: O bootstrap não publica metadados; a resposta atual é um objeto vazio.
      tags: [Operations]
      security: []
      responses:
        '200':
          description: Nenhum metadado público configurado.
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                additionalProperties: false
              examples:
                empty:
                  value: {}
  /api/v1/activities:
    get:
      tags:
      - Atividades de extensão
      summary: Lista atividades (paginado)
      operationId: listActivities
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: Tamanho da página. O servidor limita o valor efetivo a 100.
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple
          sort criteria are supported.'
        required: false
        schema:
          type: array
          items:
            type: string
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseActivityResponse'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/Problem400'
      security: []
      description: Disponível quando platform.crud.api.enabled está habilitado.
    post:
      tags:
      - Atividades de extensão
      summary: Cria uma atividade
      operationId: createActivities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/Problem400'
        '409':
          $ref: '#/components/responses/Problem409'
        '415':
          $ref: '#/components/responses/Problem415'
      security: []
      description: Disponível quando platform.crud.api.enabled está habilitado.
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
  /api/v1/activities/{id}:
    delete:
      tags:
      - Atividades de extensão
      summary: Exclui uma atividade
      operationId: deleteActivities
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: No Content
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/Problem400'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
      security: []
      description: Disponível quando platform.crud.api.enabled está habilitado.
    get:
      tags:
      - Atividades de extensão
      summary: Busca uma atividade pelo id
      operationId: getActivities
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/Problem400'
        '404':
          $ref: '#/components/responses/Problem404'
      security: []
      description: Disponível quando platform.crud.api.enabled está habilitado.
    put:
      tags:
      - Atividades de extensão
      summary: Atualiza uma atividade
      operationId: updateActivities
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/Problem400'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '415':
          $ref: '#/components/responses/Problem415'
      security: []
      description: Disponível quando platform.crud.api.enabled está habilitado.
  /api/v1/audit-events:
    get:
      tags:
      - Auditoria
      summary: Lista eventos de auditoria com filtros opcionais e paginação
      operationId: listAuditEvents
      parameters:
      - name: schemaName
        in: query
        required: false
        schema:
          type: string
      - name: tableName
        in: query
        required: false
        schema:
          type: string
      - name: operation
        in: query
        required: false
        schema:
          type: string
          enum:
          - INSERT
          - UPDATE
          - DELETE
      - name: recordId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: actorId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: occurredFrom
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: occurredTo
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: Tamanho da página. O servidor limita o valor efetivo a 100.
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple
          sort criteria are supported.'
        required: false
        schema:
          type: array
          default:
          - occurredAt,DESC
          items:
            type: string
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseAuditEventResponse'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/Problem400'
      security: []
      description: Disponível quando platform.audit.api.enabled está habilitado.
  /api/v1/audit-events/{id}:
